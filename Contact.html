<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ali Hassan Tech | Contact</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="container">

        <div id="branding">
            <h1><span class="highlight">Ali Hassan</span> Tech</h1>
        </div>

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="index.html#about">About</a></li>
                <li><a href="index.html#services">Services</a></li>
                <li class="current">
                    <a href="Contact.html">Contact</a>
                </li>
            </ul>
        </nav>

    </div>
</header>


<section class="contact-section">

    <div class="container">

        <h1>Contact Me</h1>

        <p>
            Have a project or question? Feel free to contact me.
        </p>


        <div class="contact-info">

            <div class="contact-card">
                <h3>📧 Email</h3>
                <p>ali@gmail.com</p>
            </div>

            <div class="contact-card">
                <h3>📱 Phone</h3>
                <p>+92 3146699063</p>
            </div>

        </div>


        <h2>Send Me a Message</h2>

        <form
    class="contact-form"
    action="https://formspree.io/f/mbgjvyla"
    method="POST"
>

            <label for="name">Your Name</label>

            <input
                <input
    type="text"
    id="name"
    name="name"
    placeholder="Enter your name"
    required
>
                
                
            
            >


            <label for="email">Your Email</label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >


            <label for="message">Your Message</label>

            <textarea
                id="message"
                rows="6"
                placeholder="Write your message..."
                required
            ></textarea>


            <button type="submit" class="button_1">
                Send Message
            </button>

        </form>

    </div>

</section>


<footer>
    <p>Ali Hassan Tech | © 2026</p>
</footer>


</body>
</html>
