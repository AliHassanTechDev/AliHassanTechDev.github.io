<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f7fc; display: flex; justify-content: center; padding-top: 40px; }
    .calc { background: #fff; padding: 20px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,.1); width: 280px; }
    #display { width: 100%; height: 60px; font-size: 28px; text-align: right; padding: 10px; box-sizing: border-box; border: 1px solid #d9e1ef; border-radius: 10px; margin-bottom: 14px; }
    .buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    button { height: 56px; font-size: 20px; border: none; border-radius: 10px; background: #e8eefc; cursor: pointer; }
    button:hover { background: #d3defa; }
    button.op { background: #2457f5; color: #fff; }
    button.clear { background: #ffc83d; }
    button.equal { background: #14213d; color: #fff; grid-column: span 2; }
    button.zero { grid-column: span 2; }
  </style>
</head>
<body>
  <div class="calc">
    <input id="display" value="0" readonly>
    <div class="buttons">
      <button class="clear" data-action="clear">C</button>
      <button class="op" data-value="/">÷</button>
      <button class="op" data-value="*">×</button>
      <button class="op" data-value="-">−</button>

      <button data-value="7">7</button>
      <button data-value="8">8</button>
      <button data-value="9">9</button>
      <button class="op" data-value="+">+</button>

      <button data-value="4">4</button>
      <button data-value="5">5</button>
      <button data-value="6">6</button>
      <button data-value="." >.</button>

      <button data-value="1">1</button>
      <button data-value="2">2</button>
      <button data-value="3">3</button>
      <button class="equal" data-action="equal">=</button>

      <button class="zero" data-value="0">0</button>
    </div>
  </div>

  <script>
    const display = document.getElementById("display");
    let current = "0";

    function update() {
      display.value = current;
    }

    document.querySelectorAll("button").forEach(btn => {
      btn.addEventListener("click", () => {
        const value = btn.dataset.value;
        const action = btn.dataset.action;

        if (action === "clear") {
          current = "0";
        }
        else if (action === "equal") {
          try {
            current = String(eval(current));
          } catch (e) {
            current = "Error";
          }
        }
        else if (value !== undefined) {
          if (current === "0" || current === "Error") {
            current = value;
          } else {
            current += value;
          }
        }

        update();
      });
    });

    update();
  </script>
</body>
</html>
